<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Industry Network | Coming Soon</title>
  <meta name="description" content="Gaming Industry Network - Championing the growth and welfare of India's gaming industry. Coming soon.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b1f4b 0%, #0a0b1a 70%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 720px; }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid #7c5cff;
      border-radius: 999px;
      color: #b9a8ff;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span {
      background: linear-gradient(90deg, #7c5cff, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      margin: 24px 0 16px;
      letter-spacing: 4px;
    }
    p { color: #c7c9e0; font-size: 18px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      border-radius: 8px;
      background: linear-gradient(90deg, #7c5cff, #00b4ff);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    footer { margin-top: 48px; color: #6f7290; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">🎮 Gaming Industry Network</div>
    <h1>Championing <span>India's Gaming Industry</span></h1>
    <h2>COMING SOON</h2>
    <p>We're building a home for India's developers, studios, esports teams, creators, and players. Something big is on the way.</p>
    <a class="btn" href="https://www.linkedin.com/company/gaming-industry-network/">Follow us on LinkedIn</a>
    <footer>&copy; 2026 Gaming Industry Network</footer>
  </div>
</body>
</html>
